<!doctype html>
<html lang="pt-BR">
<body style="font-family:Arial,Helvetica,sans-serif;color:#1f2933;max-width:560px;margin:0 auto">
  <h2 style="margin-bottom:4px">Resumo da coleta</h2>
  <p style="margin-top:0;color:#52606d">$quando</p>

  <table style="border-collapse:collapse;width:100%;font-size:15px">
    <tr><td style="padding:6px 0;color:#52606d">Produtos coletados</td><td style="text-align:right">$total</td></tr>
    <tr><td style="padding:6px 0;color:#52606d">Com sucesso</td><td style="text-align:right">$ok</td></tr>
    <tr><td style="padding:6px 0;color:#52606d">Com falha</td><td style="text-align:right">$falhas</td></tr>
    <tr><td style="padding:6px 0;color:#52606d">Links corrigidos sozinhos</td><td style="text-align:right">$links_corrigidos</td></tr>
    <tr><td style="padding:6px 0;color:#52606d">Links aguardando revisão</td><td style="text-align:right">$em_revisao</td></tr>
    <tr><td style="padding:6px 0;color:#52606d">Quedas de preço detectadas</td><td style="text-align:right">$quedas</td></tr>
  </table>

  <p style="font-size:14px">$detalhe_falhas</p>
  <p style="font-size:12px;color:#9aa5b1">Enviado pelo SEARCHING.</p>
</body>
</html>
