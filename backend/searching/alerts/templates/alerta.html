<!doctype html>
<html lang="pt-BR">
<body style="font-family:Arial,Helvetica,sans-serif;color:#1f2933;max-width:560px;margin:0 auto">
  <h2 style="margin-bottom:4px">Queda de preço: $nome</h2>
  <p style="margin-top:0;color:#52606d">$loja &middot; coletado em $quando</p>

  <table style="border-collapse:collapse;width:100%;font-size:15px">
    <tr><td style="padding:6px 0;color:#52606d">Preço anterior ($base_preco)</td><td style="text-align:right">$preco_anterior</td></tr>
    <tr><td style="padding:6px 0;color:#52606d">Preço atual ($base_preco)</td><td style="text-align:right;font-weight:bold;font-size:18px">$preco_atual</td></tr>
    <tr><td style="padding:6px 0;color:#52606d">Queda</td><td style="text-align:right;color:#0a7d3b;font-weight:bold">$queda_pct</td></tr>
    <tr><td style="padding:6px 0;color:#52606d">Motivo</td><td style="text-align:right">$motivo</td></tr>
  </table>

  <p><a href="$link" style="display:inline-block;padding:10px 16px;background:#0066cc;color:#fff;text-decoration:none;border-radius:6px">Abrir anúncio</a></p>
  <p style="font-size:13px;color:#52606d">$print_aviso</p>
  <p style="font-size:12px;color:#9aa5b1">Enviado pelo SEARCHING.</p>
</body>
</html>
